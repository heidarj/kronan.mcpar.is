<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krónan shopping</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.45 system-ui,sans-serif; --surface:#fff; --ink:#18221b; --muted:#58635c; --line:#e3e8e4; --accent:#ffe300; }
    @media(prefers-color-scheme:dark) { :root { --surface:#202520; --ink:#f0f4ef; --muted:#bdc8be; --line:#3b443b; } }
    :root[data-theme=dark] { --surface:#202520; --ink:#f0f4ef; --muted:#bdc8be; --line:#3b443b; }
    :root[data-theme=light] { --surface:#fff; --ink:#18221b; --muted:#58635c; --line:#e3e8e4; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; padding:20px; color:var(--ink); background:var(--surface); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .badge { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; background:var(--accent); color:#18221b; font-weight:800; font-size:21px; }
    h1 { font-size:19px; margin:0; letter-spacing:-.3px; }
    p { margin:2px 0; color:var(--muted); }
    button,input { font:inherit; }
    button { min-height:44px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--ink); background:var(--surface); cursor:pointer; }
    button.primary { background:var(--accent); color:#18221b; border-color:var(--accent); font-weight:650; }
    button:disabled { opacity:.5; cursor:default; }
    button:focus-visible,input:focus-visible { outline:3px solid #549566; outline-offset:2px; }
    input { min-height:44px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--surface); color:var(--ink); min-width:0; }
    form { display:flex; gap:8px; margin:16px 0; }
    form input { flex:1; }
    ul { padding:0; margin:0; list-style:none; }
    li { padding:12px 0; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    .label { flex:1; min-width:0; overflow-wrap:anywhere; }
    .completed .label { text-decoration:line-through; color:var(--muted); }
    .quantity { width:70px; }
    .product-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; }
    .product { padding:14px; border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; gap:10px; }
    .product img { width:100%; height:110px; object-fit:contain; border-radius:8px; background:#fff; }
    .product h2 { font-size:15px; margin:0; overflow-wrap:anywhere; }
    .price { font-size:18px; font-weight:750; margin-top:auto; }
    .price del { color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
    #status { margin-top:14px; min-height:22px; font-size:13px; overflow-wrap:anywhere; }
    #status.error { color:#bb493b; }
    .empty { padding:24px 0; text-align:center; color:var(--muted); }
    @media(max-width:380px) { body { padding:14px; } li { flex-wrap:wrap; } .label { flex-basis:calc(100% - 85px); } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="badge" aria-hidden="true">K</span><div><h1 id="title">Your shopping list</h1><p id="subtitle">Connected to Krónan</p></div></div>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <main id="content"><p class="empty">Waiting for your shopping connection…</p></main>
  <form id="add-form" hidden><input id="item" maxlength="255" placeholder="Add an item, e.g. butter…" aria-label="Item to add" autocomplete="off"><button class="primary" type="submit">Add</button></form>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
  (() => {
    "use strict";
    const content = document.getElementById("content"), status = document.getElementById("status");
    const form = document.getElementById("add-form"), refresh = document.getElementById("refresh");
    const pending = new Map();
    let sequence = 0, ready = false, busy = false, canWrite = false, latest = null, targetOrigin = "*";
    // Kept only while this iframe lives. Uncertain mutations are not silently prepared again.
    let uncertain = false, retryOperation = null;
    const money = new Intl.NumberFormat("is-IS", { style:"currency", currency:"ISK", maximumFractionDigits:0 });
    function notify(method, params) { window.parent.postMessage({jsonrpc:"2.0", method, params}, targetOrigin); }
    function rpc(method, params) {
      return new Promise((resolve,reject) => {
        const id = ++sequence;
        const timer = setTimeout(() => { pending.delete(id); reject(new Error("The connection timed out. Refresh the list before repeating a change.")); }, 35000);
        pending.set(id, {resolve,reject,timer});
        window.parent.postMessage({jsonrpc:"2.0", id, method, params}, targetOrigin);
      });
    }
    function message(text, error = false) { status.textContent = text; status.className = error ? "error" : ""; }
    function element(tag, text, className) {
      const el = document.createElement(tag);
      if (text != null) el.textContent = String(text);
      if (className) el.className = className;
      return el;
    }
    function disableControls() {
      document.querySelectorAll("button,input").forEach(el => el.disabled = busy || !ready || (el !== refresh && (!canWrite || uncertain)));
    }
    function receive(result) {
      if (!result || result.isError) return;
      const data = result.structuredContent;
      if (!data || typeof data !== "object") return;
      if (typeof data.canWrite === "boolean") canWrite = data.canWrite;
      if (data.note && Array.isArray(data.note.lines)) { latest = { note:data.note }; renderNote(data.note); }
      else if (Array.isArray(data.products)) { latest = { products:data.products }; renderProducts(data.products); }
      disableControls();
      notify("ui/notifications/size-changed", {height:document.documentElement.scrollHeight});
    }
    async function tool(name, args) {
      const result = await rpc("tools/call", {name, arguments:args});
      if (result?.isError) {
        const details = result.structuredContent?.error;
        const error = new Error(details?.message || result.content?.find(c => c.type === "text")?.text || "The operation failed.");
        error.code = details?.code; error.unknown = !!details?.outcomeUnknown;
        if (details?.retryAfterSeconds) error.message += " Try again in " + details.retryAfterSeconds + " seconds.";
        throw error;
      }
      return result;
    }
    async function run(action) {
      if (busy || !ready) return;
      busy = true; disableControls(); message("Working…");
      try { await action(); }
      catch (error) { message(error.message || "The operation failed.", true); }
      finally { busy = false; disableControls(); }
    }
    async function change(request) {
      if (uncertain) throw new Error("Refresh and inspect the list before making another change.");
      const fingerprint = JSON.stringify(request);
      let id;
      if (retryOperation?.fingerprint === fingerprint) id = retryOperation.id;
      else {
        const prepared = await tool("PrepareShoppingChange", {change:request});
        id = prepared.structuredContent?.prepared?.operationId;
        if (!id) throw new Error("This change could not be prepared.");
      }
      retryOperation = {id, fingerprint};
      const names = {add:"AddShoppingItems",update:"UpdateShoppingItem",remove:"RemoveShoppingItem"};
      const args = {operationId:id};
      if (request.items) args.items = request.items;
      if (request.lineToken) args.lineToken = request.lineToken;
      if (request.text != null) args.text = request.text;
      if (request.quantity != null) args.quantity = request.quantity;
      try {
        const result = await tool(names[request.action], args);
        retryOperation = null; receive(result); message("Shopping list updated.");
      } catch (error) {
        // Only failures known to occur before dispatch permit a button retry with the same ID.
        if (!["rate_limited","concurrent_limit","upstream_cooldown"].includes(error.code)) uncertain = true;
        throw error;
      }
    }
    function renderNote(note) {
      document.getElementById("title").textContent = note.name || "Your shopping list";
      document.getElementById("subtitle").textContent = note.lines.length + " items · Krónan";
      content.replaceChildren(); form.hidden = !canWrite;
      if (!note.lines.length) content.append(element("p", "Your list is empty. Add your first item below.", "empty"));
      const list = element("ul");
      for (const line of note.lines.slice(0,200)) {
        const row = element("li", null, line.isCompleted ? "completed" : "");
        row.append(element("span", line.text || line.product?.name || "Item", "label"));
        const quantity = element("input", null, "quantity");
        quantity.type = "number"; quantity.min = "0"; quantity.max = "10000"; quantity.step = "1"; quantity.value = String(line.quantity ?? 1);
        quantity.setAttribute("aria-label", "Quantity for " + (line.text || line.product?.name || "item"));
        quantity.addEventListener("change", () => {
          const amount = Number(quantity.value);
          if (!Number.isInteger(amount) || amount < 0 || amount > 10000) { quantity.value = String(line.quantity ?? 1); return; }
          run(() => change({action:"update",lineToken:line.token,quantity:amount}));
        });
        row.append(quantity);
        const remove = element("button", "Remove"); remove.type = "button";
        remove.setAttribute("aria-label", "Remove " + (line.text || line.product?.name || "item"));
        remove.addEventListener("click", () => {
          remove.hidden = true;
          const yes = element("button", "Confirm removal"); yes.type = "button";
          const cancel = element("button", "Cancel"); cancel.type = "button";
          yes.addEventListener("click", () => run(() => change({action:"remove",lineToken:line.token})));
          cancel.addEventListener("click", () => { yes.remove(); cancel.remove(); remove.hidden = false; });
          row.append(yes, cancel); yes.focus();
        });
        row.append(remove); list.append(row);
      }
      content.append(list);
      if (note.lines.length > 200) content.append(element("p", "Showing the first 200 items. The complete list is available in Krónan."));
    }
    function renderProducts(products) {
      document.getElementById("title").textContent = "Selected products";
      document.getElementById("subtitle").textContent = "Home-delivery catalogue · Prices in ISK";
      content.replaceChildren(); form.hidden = true;
      const grid = element("div", null, "product-grid");
      for (const product of products.slice(0,6)) {
        const card = element("article", null, "product");
        if (typeof product.thumbnail === "string") {
          try { const url = new URL(product.thumbnail); if (url.protocol === "https:") {
            const img = element("img"); img.src = url.href; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.onerror = () => img.remove(); card.append(img);
          } } catch { /* Product text still works without an image. */ }
        }
        card.append(element("h2", product.name || "Product"));
        const price = element("div", money.format(product.onSale ? product.discountedPrice : product.price), "price");
        if (product.onSale) price.append(element("del", money.format(product.price)));
        card.append(price);
        if (product.priceInfo) card.append(element("p", product.priceInfo));
        const add = element("button", "Add to list", "primary"); add.type = "button";
        add.addEventListener("click", () => run(() => change({action:"add",items:[{sku:product.sku,quantity:1}]})));
        card.append(add); grid.append(card);
      }
      content.append(grid);
      if (!products.length) content.append(element("p", "These products could not be found.", "empty"));
    }
    refresh.addEventListener("click", () => run(async () => {
      const result = await tool("GetShoppingList", {});
      receive(result);
      retryOperation = null; uncertain = false;
      message("List refreshed. Inspect it before repeating an unconfirmed change.");
    }));
    form.addEventListener("submit", event => {
      event.preventDefault(); const input = document.getElementById("item"), text = input.value.trim();
      if (!text) return;
      run(async () => { await change({action:"add",items:[{text,quantity:1}]}); input.value = ""; });
    });
    window.addEventListener("message", event => {
      if (event.source !== window.parent || !event.data || event.data.jsonrpc !== "2.0") return;
      const data = event.data;
      if (event.origin !== "null" && event.origin) targetOrigin = event.origin;
      if (data.id != null && pending.has(data.id)) {
        const request = pending.get(data.id); pending.delete(data.id); clearTimeout(request.timer);
        data.error ? request.reject(new Error(data.error.message || "Connection error.")) : request.resolve(data.result); return;
      }
      if (data.method === "ui/notifications/tool-result") receive(data.params);
      if (data.method === "ui/notifications/host-context-changed" && ["light","dark"].includes(data.params?.theme)) document.documentElement.dataset.theme = data.params.theme;
      if (data.method === "ui/resource-teardown" && data.id != null) {
        window.parent.postMessage({jsonrpc:"2.0",id:data.id,result:{}}, targetOrigin);
        ready = false; disableControls();
        for (const p of pending.values()) { clearTimeout(p.timer); p.reject(new Error("The card was closed.")); } pending.clear();
      }
    });
    disableControls();
    rpc("ui/initialize", {appInfo:{name:"kronan-shopping",version:"0.1.0"},appCapabilities:{},protocolVersion:"2026-01-26"})
      .then(result => {
        ready = true;
        if (["light","dark"].includes(result?.hostContext?.theme)) document.documentElement.dataset.theme = result.hostContext.theme;
        notify("ui/notifications/initialized", {}); disableControls();
      }).catch(() => message("This host could not initialize the shopping card. You can still use the shopping tools in chat.", true));
  })();
  </script>
</body>
</html>
